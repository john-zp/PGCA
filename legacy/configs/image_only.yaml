experiment:
  task: image_only

paths:
  data_root: data/us
  split_dir: data/us/splits
  labels_csv: data/us/labels.csv
  feature_xlsx: data/us/X_with_only_feature.xlsx
  phrase_xlsx: data/us/X_with_only_phrase.xlsx
  output_dir: runs/image_only

model:
  num_classes: 6
  image_size: 384
  image_embed_dim: 256
  hidden_dim: 256
  dropout: 0.2

loss:
  lambda_ord: 1.0
  lambda_sb_static: 0.0
  lambda_sb_path: 0.0
  sb_eps: 0.05
  sb_iters: 50
  sb_steps: 3

train:
  seed: 42
  batch_size: 16
  num_workers: 0
  lr: 0.0003
  weight_decay: 0.0001
  epochs: 30