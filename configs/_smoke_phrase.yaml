experiment:
  name: phrase_only
  task: phrase_only
paths:
  data_root: data/us
  labels_csv: data/us/labels.csv
  phrase_xlsx: data/us/X_with_only_phrase.xlsx
  split_dir: data/us/splits
  output_dir: runs/_smoke_phrase
model:
  phrase_dim: auto
  hidden_dims:
  - 256
  - 128
  dropout: 0.2
  num_classes: 6
train:
  seed: 42
  epochs: 1
  batch_size: 64
  num_workers: 0
  lr: 0.0005
  weight_decay: 0.0001
loss:
  lambda_ord: 1.0
logging:
  save_every: 1
