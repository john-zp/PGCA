experiment:
  task: image_only

paths:
  data_root: data/us
  split_dir: data/us/sample_splits
  labels_csv: data/us/labels.csv
  feature_xlsx: data/us/X_with_only_feature.xlsx
  phrase_xlsx: data/us/X_with_only_phrase.xlsx
  output_dir: runs/_smoke_image

model:
  num_classes: 6
  image_size: 256
  image_embed_dim: 128
  hidden_dim: 128
  dropout: 0.2

loss:
  lambda_ord: 1.0
  lambda_sb_static: 0.0
  lambda_sb_path: 0.0
  sb_eps: 0.05
  sb_iters: 20
  sb_steps: 2

train:
  seed: 42
  batch_size: 4
  num_workers: 0
  lr: 0.0005
  weight_decay: 0.0001
  epochs: 2