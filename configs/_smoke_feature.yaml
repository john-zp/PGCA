experiment:
  name: feature_only
  task: feature_only
paths:
  data_root: data/us
  labels_csv: data/us/labels.csv
  feature_xlsx: data/us/X_with_only_feature.xlsx
  split_dir: data/us/splits
  output_dir: runs/_smoke_feature
model:
  feature_dim: auto
  hidden_dims:
  - 128
  - 64
  dropout: 0.2
  num_classes: 6
train:
  seed: 42
  epochs: 1
  batch_size: 64
  num_workers: 0
  lr: 0.001
  weight_decay: 0.0001
loss:
  lambda_ord: 1.0
logging:
  save_every: 1
